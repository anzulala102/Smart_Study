<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title description">
  <title id="title">SmartStudy system architecture</title>
  <desc id="description">Student and administrator browsers access an Express application, which handles authentication, API routes, Mongoose models, MongoDB, and a reminder worker.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#edf3f1"/>
    </linearGradient>
    <linearGradient id="server" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24345b"/>
      <stop offset="1" stop-color="#172442"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#15213a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#6b8190"/>
    </marker>
    <marker id="arrowLight" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#9eb4bd"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#1b2340}
      .title{font-size:38px;font-weight:700}
      .subtitle{font-size:18px;fill:#667085}
      .node{filter:url(#shadow)}
      .card{fill:#fff;stroke:#dbe3e4;stroke-width:2}
      .server{fill:url(#server);stroke:#172442;stroke-width:2}
      .node-title{font-size:23px;font-weight:700}
      .node-copy{font-size:16px;fill:#687486}
      .server-title{font-size:26px;font-weight:700;fill:#fff}
      .server-copy{font-size:16px;fill:#d7e0ef}
      .label{font-size:14px;font-weight:700;fill:#52657a}
      .line{fill:none;stroke:#6b8190;stroke-width:3;marker-end:url(#arrow)}
      .line-light{fill:none;stroke:#9eb4bd;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrowLight)}
      .pill{fill:#e9f1ee;stroke:#d5e4dd;stroke-width:1}
      .pill-text{font-size:14px;font-weight:700;fill:#426b5d}
    </style>
  </defs>
  <rect width="1600" height="920" rx="26" fill="url(#background)"/>
  <text x="80" y="82" class="title">SmartStudy system architecture</text>
  <text x="80" y="116" class="subtitle">Browser dashboards · REST API · MongoDB persistence · scheduled in-app reminders</text>

  <g class="node">
    <rect x="82" y="210" width="300" height="155" rx="18" class="card"/>
    <circle cx="126" cy="254" r="20" fill="#e9f1ee"/>
    <path d="M116 254h20M126 244v20" stroke="#527b68" stroke-width="3" stroke-linecap="round"/>
    <text x="160" y="259" class="node-title">Student dashboard</text>
    <text x="110" y="304" class="node-copy">HTML · CSS · Vanilla JavaScript</text>
    <text x="110" y="334" class="node-copy">Courses, tasks, progress, reminders</text>
  </g>
  <g class="node">
    <rect x="82" y="430" width="300" height="155" rx="18" class="card"/>
    <circle cx="126" cy="474" r="20" fill="#edf0f8"/>
    <path d="M117 478v-10a9 9 0 0 1 18 0v10m-21 0h24v13h-24z" fill="none" stroke="#52658b" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="160" y="479" class="node-title">Admin dashboard</text>
    <text x="110" y="524" class="node-copy">HTML · CSS · Vanilla JavaScript</text>
    <text x="110" y="554" class="node-copy">Metrics, students, assignment review</text>
  </g>
  <g class="node">
    <rect x="596" y="292" width="412" height="300" rx="24" class="server"/>
    <text x="802" y="346" text-anchor="middle" class="server-title">Node.js + Express</text>
    <text x="802" y="378" text-anchor="middle" class="server-copy">SmartStudy web server</text>
    <rect x="644" y="410" width="316" height="54" rx="12" fill="#34466e"/>
    <text x="802" y="444" text-anchor="middle" class="server-copy">REST API · /api/*</text>
    <rect x="644" y="480" width="316" height="54" rx="12" fill="#34466e"/>
    <text x="802" y="514" text-anchor="middle" class="server-copy">JWT authentication · admin role checks</text>
    <rect x="677" y="556" width="250" height="27" rx="13" class="pill"/>
    <text x="802" y="575" text-anchor="middle" class="pill-text">Helmet · CORS · rate limiting</text>
  </g>
  <g class="node">
    <rect x="1218" y="178" width="300" height="150" rx="18" class="card"/>
    <circle cx="1262" cy="222" r="20" fill="#f3eddf"/>
    <path d="M1250 218h24v17h-24zM1255 213h14" fill="none" stroke="#98743d" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="1296" y="227" class="node-title">Mongoose models</text>
    <text x="1246" y="270" class="node-copy">Schemas · validation · references</text>
    <text x="1246" y="299" class="node-copy">Student · Course · Assignment</text>
  </g>
  <g class="node">
    <rect x="1218" y="395" width="300" height="150" rx="18" class="card"/>
    <ellipse cx="1262" cy="440" rx="19" ry="8" fill="#e8eef5" stroke="#56708c" stroke-width="2"/>
    <path d="M1243 440v29c0 5 9 9 19 9s19-4 19-9v-29M1243 454c0 5 9 9 19 9s19-4 19-9" fill="#e8eef5" stroke="#56708c" stroke-width="2"/>
    <text x="1296" y="445" class="node-title">MongoDB</text>
    <text x="1246" y="489" class="node-copy">Persistent document database</text>
    <text x="1246" y="518" class="node-copy">Five collections · ObjectId references</text>
  </g>
  <g class="node">
    <rect x="596" y="694" width="412" height="132" rx="20" class="card"/>
    <circle cx="646" cy="740" r="20" fill="#fbf1df"/>
    <path d="M646 727v14l10 6M646 722a19 19 0 1 0 18 13" fill="none" stroke="#a57c35" stroke-width="2.5" stroke-linecap="round"/>
    <text x="684" y="744" class="node-title">Reminder worker</text>
    <text x="630" y="784" class="node-copy">Polls due reminders · records in-app delivery</text>

  </g>
  <path d="M382 283H530Q562 283 596 342" class="line"/>
  <path d="M382 507H510Q564 507 596 480" class="line"/>
  <text x="431" y="264" class="label">HTTPS / browser requests</text>
  <text x="433" y="539" class="label">HTTPS / admin requests</text>
  <path d="M1008 354H1112Q1160 354 1218 253" class="line"/>
  <text x="1058" y="332" class="label">data mapping</text>
  <path d="M1368 328V395" class="line"/>
  <text x="1386" y="369" class="label">queries</text>
  <path d="M802 592V694" class="line-light"/>
  <text x="824" y="649" class="label">scheduled polling</text>
  <path d="M1008 760H1120Q1170 760 1218 510" class="line-light"/>
  <text x="1045" y="738" class="label">read / update reminders</text>
  <rect x="80" y="862" width="1440" height="2" fill="#dbe4e1"/>
  <text x="80" y="891" class="subtitle">All dashboard actions use the same authenticated API and persistent database.</text>
</svg>
