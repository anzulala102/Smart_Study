<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartStudy · Admin</title><link rel="stylesheet" href="css/style.css"><style>
.admin-wrap{max-width:1100px;margin:36px auto;padding:24px}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin:24px 0}.admin-stat,.admin-panel{background:#fff;border:1px solid #e8e5df;border-radius:14px;padding:18px}.admin-stat b{display:block;font-size:30px;margin-top:8px}.admin-panel{margin:16px 0;overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #eee;font-size:14px}input,select{padding:9px;border:1px solid #ddd;border-radius:7px}.admin-login{max-width:390px;margin:10vh auto;background:white;padding:28px;border-radius:14px}.admin-login input{width:100%;margin:8px 0}.muted{color:#777}.admin-actions button{margin:2px}
</style></head><body><div id="admin-login" class="admin-login"><h2>SmartStudy Admin</h2><p class="muted">Sign in with an administrator account.</p><form id="login"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button class="btn-primary">Sign in</button></form><p id="error" role="alert"></p></div>
<main id="admin-app" class="admin-wrap" hidden><header class="admin-top"><div><h1>Administrator dashboard</h1><p class="muted">Manage students, assignments and academic activity.</p></div><button id="logout" class="btn-add">Log out</button></header><section class="admin-grid" id="stats"></section><section class="admin-panel"><h2>Students</h2><table><thead><tr><th>Name</th><th>Email</th><th>Student ID</th><th>Joined</th><th>Action</th></tr></thead><tbody id="students"></tbody></table></section><section class="admin-panel"><h2>Assignments</h2><table><thead><tr><th>Assignment</th><th>Student</th><th>Course</th><th>Deadline</th><th>Status</th><th>Action</th></tr></thead><tbody id="assignments"></tbody></table></section></main>
<script>
const api='/api';let token=localStorage.getItem('ss_admin_token');const headers=()=>({'Content-Type':'application/json',Authorization:'Bearer '+token});async function request(url,opts={}){const r=await fetch(api+url,{...opts,headers:{...headers(),...(opts.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d;}
async function load(){try{const me=await request('/auth/me');if(me.user.role!=='admin')throw Error('This account is not an administrator');document.getElementById('admin-login').hidden=true;document.getElementById('admin-app').hidden=false;const [o,s,a]=await Promise.all([request('/admin/overview'),request('/admin/students'),request('/admin/assignments')]);document.getElementById('stats').innerHTML=Object.entries({Students:o.students,Courses:o.courses,Assignments:o.assignments,Submissions:o.submissions,'Overdue assignments':o.overdue}).map(([k,v])=>`<div class="admin-stat">${k}<b>${v}</b></div>`).join('');document.getElementById('students').innerHTML=s.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${esc(x.studentId||'—')}</td><td>${new Date(x.createdAt).toLocaleDateString()}</td><td><button data-delete-student="${x._id}">Remove</button></td></tr>`).join('');document.getElementById('assignments').innerHTML=a.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.student?.name||'—')}</td><td>${esc(x.course?.code||'—')}</td><td><input type="date" data-deadline="${x._id}" value="${new Date(x.deadline).toISOString().slice(0,10)}"></td><td><select data-status="${x._id}">${['Pending','In Progress','Completed'].map(v=>`<option ${x.status===v?'selected':''}>${v}</option>`).join('')}</select></td><td><button data-save="${x._id}">Save</button></td></tr>`).join('');}catch(e){localStorage.removeItem('ss_admin_token');token=null;document.getElementById('error').textContent=e.message;document.getElementById('admin-login').hidden=false;document.getElementById('admin-app').hidden=true;}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();try{const d=await fetch(api+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})}).then(r=>r.json());if(!d.token)throw Error(d.error||'Login failed');token=d.token;localStorage.setItem('ss_admin_token',token);await load();}catch(e){document.getElementById('error').textContent=e.message;}});
document.addEventListener('click',async e=>{try{if(e.target.dataset.save){const id=e.target.dataset.save;await request('/admin/assignments/'+id,{method:'PATCH',body:JSON.stringify({deadline:document.querySelector(`[data-deadline="${id}"]`).value,status:document.querySelector(`[data-status="${id}"]`).value})});await load();}if(e.target.dataset.deleteStudent){if(confirm('Remove this student account?')){await request('/admin/students/'+e.target.dataset.deleteStudent,{method:'DELETE'});await load();}}}catch(err){alert(err.message);}});
document.getElementById('logout').addEventListener('click',()=>{localStorage.removeItem('ss_admin_token');location.reload();});if(token)load();
</script></body></html>
